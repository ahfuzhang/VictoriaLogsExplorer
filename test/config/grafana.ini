#################################### Server ####################################
[server]
# Grafana web server 的监听端口
http_port = 3000

# 绑定地址（0.0.0.0 允许外网访问）
http_addr = 0.0.0.0

# 根URL （一般不用改）
root_url = http://localhost:3000

#################################### Security ##################################
[security]
# 登录默认管理员账号密码
admin_user = admin
admin_password = admin

# 允许通过 iframe 访问（某些场景需要）
allow_embedding = true

#################################### Users #####################################
[users]
default_theme = dark        # light / dark
allow_sign_up = false        # 是否允许注册

#################################### Paths #####################################
[paths]
# Grafana 的数据目录（数据库、sessions 等）
data = /var/lib/grafana

# 配置文件路径（本文件所在位置）
config = /etc/grafana/grafana.ini

# 插件目录
plugins = /var/lib/grafana/plugins

#################################### Plugins ####################################
[plugins]
# 允许加载未签名插件（非常重要）
# 多个插件请用逗号分隔
allow_loading_unsigned_plugins = victoriametrics-victorialogs-explorer

#################################### Logging ####################################
[log]
# 日志级别：debug | info | warn | error | critical
level = info

# 日志模式：console | file
mode = console

# 是否使用彩色日志输出
console_format = console

[log.console]
level = info

#################################### Analytics #################################
[analytics]
reporting_enabled = false
check_for_updates = true

#################################### Dataproxy #################################
[dataproxy]
# 配置 Grafana proxy 数据源转发行为
timeout = 30

#################################### Feature Toggles ############################
[feature_toggles]
# 启用新的 panel 编辑器、query builder 等实验特性
enable = tempoSearch,vizRepeat,expressions
