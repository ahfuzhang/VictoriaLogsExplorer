# Builds and publishes the plugin (unsigned: Grafana signs it after the catalog review) when a version tag (e.g. v1.0.0) is pushed.
# The plugin lives in a subdirectory, which grafana/plugin-actions/build-plugin does not support,
# so the same steps are spelled out here.
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victoriametrics-victorialogsexplorer-panel
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: victoriametrics-victorialogsexplorer-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check package version matches tag
        env:
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          PLUGIN_VERSION=$(jq -r .info.version dist/plugin.json)
          if [ "v${PLUGIN_VERSION}" != "${GITHUB_TAG}" ]; then
            echo "Plugin version ${PLUGIN_VERSION} doesn't match tag ${GITHUB_TAG}. The tag should be v${PLUGIN_VERSION}"
            exit 1
          fi

      - name: Package plugin
        id: package
        run: |
          PLUGIN_ID=$(jq -r .id dist/plugin.json)
          PLUGIN_VERSION=$(jq -r .info.version dist/plugin.json)
          ARCHIVE="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
          mv dist "${PLUGIN_ID}"
          zip "${ARCHIVE}" "${PLUGIN_ID}" -r
          md5sum "${ARCHIVE}" > "${ARCHIVE}.md5"
          sha1sum "${ARCHIVE}" > "${ARCHIVE}.sha1"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          # first "## " section of CHANGELOG.md becomes the release notes
          awk '/^## / {s++} s == 1 {print}' CHANGELOG.md > release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            "${ARCHIVE}" "${ARCHIVE}.md5" "${ARCHIVE}.sha1" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file release_notes.md \
            --draft
